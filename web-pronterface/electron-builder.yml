appId: dk.patrick.PrintInterface
productName: PrintInterface

directories:
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/tray-icon.png
    to: tray-icon.png

asar: true

asarUnpack:
  - node_modules/@serialport/**/*
  - node_modules/serialport/**/*

compression: normal
npmRebuild: true

win:
  executableName: PrintInterface

  target:
    - target: nsis
      arch:
        - x64

  artifactName: "${productName}-${version}-${arch}-Setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PrintInterface